<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Portal interactivo de Física para secundaria: teoría, ejemplos, prácticas y simuladores.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Física Interactiva | Portal de aprendizaje">
  <meta property="og:description" content="Teoría, ejemplos, prácticas y simuladores de Física para secundaria.">
  <title>Física Interactiva | Portal de aprendizaje</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Ctext x='32' y='45' font-size='40' text-anchor='middle' fill='%23ffffff' font-family='Georgia,serif'%3E%E2%88%91%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .skip-link{position:absolute;left:-9999px;top:0;z-index:1000;padding:.7rem 1rem;background:#fff;color:#0b1220;font-weight:600;border-radius:0 0 8px 0}
    .skip-link:focus{left:0}
    .noscript-msg{margin:1rem;padding:1rem;border:1px solid currentColor;border-radius:8px}
  </style>
</head>
<body>
  <a class="skip-link" href="#app">Ir al contenido</a>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Menú lateral">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">∑</span>
        <div>
          <b>Física<span>Interactiva</span></b>
          <small>Aprendé a tu ritmo</small>
        </div>
      </div>
      <div class="nav-label">EXPLORAR</div>
      <nav id="nav" aria-label="Secciones del portal"></nav>
      <div class="sidebar-foot">
        <span class="status-dot" aria-hidden="true"></span> Disponible sin servidor
        <small>Progreso guardado en este dispositivo</small>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button type="button" class="mobile-menu" id="menu" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div class="breadcrumbs" id="breadcrumbs" aria-live="polite">Inicio / Panel de aprendizaje</div>
        <div class="top-actions">
          <button type="button" class="theme-toggle" id="theme" title="Cambiar tema" aria-label="Cambiar tema">☾</button>
          <span class="avatar" aria-hidden="true">F</span>
        </div>
      </header>

      <main id="app" tabindex="-1">
        <noscript><p class="noscript-msg">Este portal necesita JavaScript activado para mostrar su contenido.</p></noscript>
      </main>

      <footer>Física Interactiva · Recursos para secundaria · Contenido educativo editable</footer>
    </div>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>

</html>
